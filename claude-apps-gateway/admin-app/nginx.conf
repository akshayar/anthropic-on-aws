server {
    listen 3000;

    # GATEWAY_HOST is injected as an env var by ECS (the internal ALB DNS name).
    # The ALB only exposes HTTPS:443 for the gateway; there is no HTTP:8080 listener.
    # proxy_ssl_verify is off because the ACM cert on the ALB is issued for a custom
    # domain, not the ALB DNS name — but the connection is still encrypted and the
    # route is VPC-internal, protected by the SG that restricts ALB → gateway:8080.
    # VPC DNS resolver required for dynamic upstream resolution.
    resolver 169.254.169.253 valid=10s;
    set $gateway_host "${GATEWAY_HOST}";

    location /v1 {
        proxy_pass https://$gateway_host;
        proxy_ssl_verify off;
        proxy_set_header Host $gateway_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /oauth {
        proxy_pass https://$gateway_host;
        proxy_ssl_verify off;
        proxy_set_header Host $gateway_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /device {
        proxy_pass https://$gateway_host;
        proxy_ssl_verify off;
        proxy_set_header Host $gateway_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
    location /readyz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
    location /.well-known {
        proxy_pass https://$gateway_host;
        proxy_ssl_verify off;
        proxy_set_header Host $gateway_host;
    }
    location /managed {
        proxy_pass https://$gateway_host;
        proxy_ssl_verify off;
        proxy_set_header Host $gateway_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
